; OpenWrt cross-build: [env:buildroot] toolchain (TARGET_* from the
; environment) without the jsoncpp dependency, same as [env:native-openwrt].
[env:buildroot-openwrt]
extends = env:buildroot
build_unflags = -ljsoncpp
build_src_filter = ${portduino_base.build_src_filter}
  -<serialization/MeshPacketSerializer.cpp>
  +<serialization/MeshPacketSerializerStub.cpp>
